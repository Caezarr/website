name: Design system

on:
  pull_request:
    paths:
      - ".storybook/**"
      - "design-system/**"
      - "public/design-system/**"
      - "public/.well-known/design-system.json"
      - "scripts/design-system/**"
      - "src/app/design-system/**"
      - "src/components/ui/**"
      - "src/design-system/**"
      - "src/styles/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/design-system.yml"
  push:
    branches:
      - main
    paths:
      - ".storybook/**"
      - "design-system/**"
      - "public/design-system/**"
      - "public/.well-known/design-system.json"
      - "scripts/design-system/**"
      - "src/app/design-system/**"
      - "src/components/ui/**"
      - "src/design-system/**"
      - "src/styles/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated contracts
        run: bun run ds:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint design-system scope
        run: >
          bunx eslint
          .storybook
          scripts/design-system
          src/design-system
          src/components/ui/*.stories.tsx
          src/components/ui/button.tsx
          src/components/ui/badge.tsx
          src/lib/fonts.ts
          src/app/design-system/page.tsx

      - name: Build Storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun run storybook:build

      - name: Verify static discovery
        run: |
          test -f storybook-static/index.json
          test -f storybook-static/.well-known/design-system.json
          test -f storybook-static/design-system/manifest.json
