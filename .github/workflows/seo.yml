name: SEO contracts
on:
  pull_request:
    paths: ['src/**', 'scripts/seo/**', 'package.json', '.github/workflows/seo.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/seo/**', 'package.json', '.github/workflows/seo.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:seo
